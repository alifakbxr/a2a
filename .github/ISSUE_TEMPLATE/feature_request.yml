name: Feature request
description: Suggest an improvement to PILAH
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the user problem, current limitation, and why it matters.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed improvement
      description: Describe the desired behavior and smallest useful scope.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
      description: Can native Antigravity or an existing PILAH capability solve this? Consider context overhead, security and maintenance.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Describe observable success and relevant negative cases.
