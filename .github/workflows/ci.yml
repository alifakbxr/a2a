name: CI Test & Quality Gate

on:
  push:
    branches: [main, 'v2.0.1']
  pull_request:
    branches: [main, 'v2.0.1']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Validate (${{ matrix.os }} - Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # Three OS families × supported LTS runtimes; keep 26 patch exact
        # to validate the same binary version used on the user's Pop!_OS.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['22', '24', '26.13.1']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Runtime version and built-in SQLite smoke
        run: |
          node --version
          node -p "process.versions.sqlite"
          node --input-type=module -e "import {Database} from './src/sqlite-compat.mjs'; const db=new Database(':memory:'); db.exec('CREATE TABLE smoke (id INTEGER PRIMARY KEY, value TEXT)'); db.prepare('INSERT INTO smoke(value) VALUES(?)').run('ok'); if(db.prepare('SELECT value FROM smoke').get().value!=='ok') process.exit(1); db.close();"

      - name: Syntax & Compilation Check
        run: |
          node --check src/engine.mjs
          node --check src/mcp.mjs
          node --check src/verification.mjs
          node --check src/storage.mjs
          node --check src/sqlite-compat.mjs
          node --check src/security.mjs
          node --check src/tokens.mjs
          node --check src/scanner.mjs
          node --check src/graph.mjs
          node --check src/tools.mjs
          node --check scripts/a2a.mjs
          node --check scripts/hook.mjs

      - name: Run Test Suite
        run: npm test

      - name: Verify Release Contracts & Schema Drift
        run: node scripts/check-release.mjs

      - name: Inspect Package Tarball Contents (Dry-Run)
        run: |
          npm pack --dry-run
          # Ensure sensitive or unwanted files are never packaged
          ! npm pack --dry-run 2>&1 | grep -E '\.env|\.pem|\.key|\.sqlite|\.tmp|tests\/|benchmarks\/'
