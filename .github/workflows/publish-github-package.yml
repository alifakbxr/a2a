name: Publish to GitHub Packages

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@alifakbxr'

      - name: Run Quality Gate & Test Suite
        run: |
          npm run syntax
          npm test
          node scripts/check-release.mjs

      - name: Verify independently authorized release candidate
        env:
          A2A_RELEASE_APPROVED_SHA: ${{ vars.A2A_RELEASE_APPROVED_SHA }}
          A2A_RELEASE_EVIDENCE_B64: ${{ secrets.A2A_RELEASE_EVIDENCE_B64 }}
          A2A_RELEASE_TRUST_KEYS_B64: ${{ secrets.A2A_RELEASE_TRUST_KEYS_B64 }}
          A2A_RELEASE_REGISTRY_B64: ${{ secrets.A2A_RELEASE_REGISTRY_B64 }}
        run: |
          git fetch origin main --no-tags
          node scripts/release-authorization.mjs

      - name: Configure package name for GitHub Packages
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.name = '@alifakbxr/a2a';
            pkg.publishConfig = { registry: 'https://npm.pkg.github.com' };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
