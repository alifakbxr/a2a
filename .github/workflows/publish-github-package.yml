name: Publish to GitHub Packages

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@alifakbxr'

      - name: Run Quality Gate & Test Suite
        run: |
          npm run syntax
          npm test
          node scripts/check-release.mjs

      - name: Verify independently authorized release candidate
        env:
          A2A_RELEASE_APPROVED_SHA: ${{ vars.A2A_RELEASE_APPROVED_SHA }}
          A2A_RELEASE_EVIDENCE_B64: ${{ secrets.A2A_RELEASE_EVIDENCE_B64 }}
          A2A_RELEASE_TRUST_KEYS_B64: ${{ secrets.A2A_RELEASE_TRUST_KEYS_B64 }}
          A2A_RELEASE_REGISTRY_B64: ${{ secrets.A2A_RELEASE_REGISTRY_B64 }}
        run: |
          set -euo pipefail
          if [ -n "$A2A_RELEASE_EVIDENCE_B64" ]; then
            git fetch origin main --no-tags
            node scripts/release-authorization.mjs
          else
            echo "A2A_RELEASE_EVIDENCE_B64 not configured, skipping external gate"
          fi

      - name: Configure package name for @alifakbxr/pilah
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.name = '@alifakbxr/pilah';
            pkg.publishConfig = { registry: 'https://npm.pkg.github.com' };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Check GitHub Packages version
        id: version_check
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VER=$(node -p "require('./package.json').version")
          if EXISTS=$(npm view "$PKG_NAME@$PKG_VER" version --registry=https://npm.pkg.github.com 2>npm-view-error.txt); then
            test "$EXISTS" = "$PKG_VER"
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          elif grep -Eq '(E404|404 Not Found)' npm-view-error.txt; then
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          else
            cat npm-view-error.txt >&2
            exit 1
          fi

      - name: Publish @alifakbxr/pilah to GitHub Packages
        if: steps.version_check.outputs.already_published == 'false'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify GitHub Packages version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VER=$(node -p "require('./package.json').version")
          test "$(npm view "$PKG_NAME@$PKG_VER" version --registry=https://npm.pkg.github.com)" = "$PKG_VER"
