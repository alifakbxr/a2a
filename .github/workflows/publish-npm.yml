name: Publish to npmjs

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  validate:
    name: Pre-Publish Security & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax Check (all src/scripts ESM)
        run: npm run syntax

      - name: Run Full Test Suite (100% Pass Required)
        run: npm test

      - name: Release Contract & Schema Drift Check
        run: node scripts/check-release.mjs

      - name: Verify independently authorized release candidate
        env:
          A2A_RELEASE_APPROVED_SHA: ${{ vars.A2A_RELEASE_APPROVED_SHA }}
          A2A_RELEASE_EVIDENCE_B64: ${{ secrets.A2A_RELEASE_EVIDENCE_B64 }}
          A2A_RELEASE_TRUST_KEYS_B64: ${{ secrets.A2A_RELEASE_TRUST_KEYS_B64 }}
          A2A_RELEASE_REGISTRY_B64: ${{ secrets.A2A_RELEASE_REGISTRY_B64 }}
        run: |
          if [ -n "$A2A_RELEASE_EVIDENCE_B64" ]; then
            git fetch origin main --no-tags
            node scripts/release-authorization.mjs
          else
            echo "A2A_RELEASE_EVIDENCE_B64 not configured, skipping external gate"
          fi

      - name: Verify Package Contents Hygiene
        run: |
          npm pack --dry-run
          # Assert zero secrets, test fixtures, or databases in tarball
          ! npm pack --dry-run 2>&1 | grep -E '\.env|\.pem|\.key|\.sqlite|\.tmp|tests\/|benchmarks\/'

  publish:
    name: Publish @aliip/pilah to npmjs.com
    needs: [validate]
    runs-on: ubuntu-latest
    environment: github-actions-pilah
    permissions:
      contents: read
      id-token: write # Required for npm Provenance (SLSA Level 3 cryptographic attestation)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify independently authorized release candidate
        env:
          A2A_RELEASE_APPROVED_SHA: ${{ vars.A2A_RELEASE_APPROVED_SHA }}
          A2A_RELEASE_EVIDENCE_B64: ${{ secrets.A2A_RELEASE_EVIDENCE_B64 }}
          A2A_RELEASE_TRUST_KEYS_B64: ${{ secrets.A2A_RELEASE_TRUST_KEYS_B64 }}
          A2A_RELEASE_REGISTRY_B64: ${{ secrets.A2A_RELEASE_REGISTRY_B64 }}
        run: |
          if [ -n "$A2A_RELEASE_EVIDENCE_B64" ]; then
            git fetch origin main --no-tags
            node scripts/release-authorization.mjs
          else
            echo "A2A_RELEASE_EVIDENCE_B64 not configured, skipping external gate"
          fi

      - name: Check Current Version vs npm Registry
        id: version_check
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VER=$(node -p "require('./package.json').version")
          echo "Target package: $PKG_NAME@$PKG_VER"
          echo "pkg_name=$PKG_NAME" >> $GITHUB_OUTPUT
          echo "pkg_ver=$PKG_VER" >> $GITHUB_OUTPUT

          # Check if version already exists on npm
          EXISTS=$(npm view "$PKG_NAME@$PKG_VER" version 2>/dev/null || true)
          if [ "$EXISTS" = "$PKG_VER" ]; then
            echo "Version $PKG_NAME@$PKG_VER is already published on npm."
            echo "already_published=true" >> $GITHUB_OUTPUT
          else
            echo "Version $PKG_NAME@$PKG_VER is new and ready to publish."
            echo "already_published=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npmjs.com (Trusted Publisher OIDC or Token)
        if: steps.version_check.outputs.already_published == 'false'
        run: |
          if [ -n "$NPM_AUTH_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_AUTH_TOKEN"
          fi
          npm publish --access public --provenance
        env:
          NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verification & Publication Summary
        if: steps.version_check.outputs.already_published == 'false'
        run: |
          echo "🎉 Successfully published ${{ steps.version_check.outputs.pkg_name }}@${{ steps.version_check.outputs.pkg_ver }} to npmjs.com with SLSA provenance!"
